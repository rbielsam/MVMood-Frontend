map $http_x_forwarded_proto $mvmood_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $mvmood_forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

map $http_x_forwarded_for $mvmood_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    location /api/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $mvmood_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $mvmood_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $mvmood_forwarded_host;
    }

    location /email/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $mvmood_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $mvmood_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $mvmood_forwarded_host;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $mvmood_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $mvmood_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $mvmood_forwarded_host;
    }

    location /storage/ {
        root /usr/share/nginx;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
